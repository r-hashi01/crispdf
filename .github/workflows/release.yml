name: release

# Publish @astlide/crispdf to npm — the ONLY supported way to publish.
# Triggered by pushing a version tag (e.g. v0.0.2) that equals
# packages/core/package.json's version. Never publish from a dev machine.
#
# Three jobs, so nothing that can publish runs code from dependencies:
#
#   verify   — lint, typecheck, browser tests, build (caches allowed: no rights).
#   build    — a fresh build, packed into a tarball; its sha256 and contents go
#              to the run summary. No publishing rights.
#   publish  — runs none of the repository's code (no checkout, no install, no
#              cache): checks the tarball and publishes it, after a maintainer
#              approves the `npm-publish` environment.
#
# npm Trusted Publishing (OIDC) — no token is stored anywhere:
#   npm trust github @astlide/crispdf --file release.yml --repo r-hashi01/crispdf --env npm-publish --allow-publish
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The pushed tag (vX.Y.Z) must equal the package version, so a stray tag
      # can never publish a mismatched version.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/core/package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $PKG"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers (and OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @astlide/crispdf exec playwright install --with-deps chromium
      - name: Install Playwright OS deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @astlide/crispdf exec playwright install-deps chromium

      - run: pnpm test
      - run: pnpm build

  build:
    name: build package
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.pack.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No cache here: what gets published is built from the lockfile alone.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          node-version-file: .nvmrc

      # No lifecycle scripts from dependencies; the build only needs tsup.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build

      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          mkdir release
          # --ignore-scripts: prepack / prepublishOnly would build again; the build is above.
          file=$(cd packages/core && npm pack --ignore-scripts --pack-destination ../../release | tail -n 1)
          meta=$(tar -xOzf "release/$file" package/package.json)
          jq -n --arg name "$(jq -r .name <<<"$meta")" --arg version "$(jq -r .version <<<"$meta")" --arg file "$file" \
            '{name: $name, version: $version, file: $file}' > release/manifest.json
          echo "digest=$(cd release && sha256sum -- * | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          {
            echo "## To publish"
            echo
            echo "\`$(jq -r .name release/manifest.json)@$(jq -r .version release/manifest.json)\`"
            echo
            echo '```'
            (cd release && sha256sum -- "$file")
            tar -tzf "release/$file"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          retention-days: 30

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    # Required reviewers on this environment: publishing waits for approval.
    environment: npm-publish
    permissions:
      id-token: write # npm Trusted Publishing (OIDC) and provenance
    steps:
      # Exactly the artifact the build job uploaded, with the contents it hashed.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact }}
          path: release
      - name: Check the artifact
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          test "$(cd release && sha256sum -- * | sha256sum | cut -d' ' -f1)" = "$DIGEST"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v4
        with:
          # npm 11.5+ for Trusted Publishing.
          node-version: 24.22.1
          registry-url: "https://registry.npmjs.org"

      - name: Publish
        run: |
          set -euo pipefail
          file=$(jq -r .file release/manifest.json)
          [[ "$file" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*\.tgz$ && -f "release/$file" ]] || { echo "bad file: $file"; exit 1; }
          # Name and version come from the tarball itself.
          meta=$(tar -xOzf "release/$file" package/package.json)
          name=$(jq -r .name <<<"$meta")
          version=$(jq -r .version <<<"$meta")
          [ "$name" = "@astlide/crispdf" ] || { echo "unexpected package: $name"; exit 1; }
          [ "$version" = "${GITHUB_REF_NAME#v}" ] || { echo "version $version doesn't match tag $GITHUB_REF_NAME"; exit 1; }
          if jq -e '.scripts // {} | has("preinstall") or has("install") or has("postinstall")' <<<"$meta" >/dev/null; then
            echo "install scripts in the tarball"; exit 1
          fi
          # Only "not found" means unpublished; any other error stops.
          if out=$(npm view "$name@$version" version 2>&1); then
            echo "$name@$version is already on npm"; exit 0
          elif ! grep -q "E404" <<<"$out"; then
            echo "$out"; exit 1
          fi
          tag=latest
          [[ "$version" == *-* ]] && tag=next
          # "./": a bare "release/x.tgz" reads as a GitHub user/repo spec.
          npm publish "./release/$file" --access public --provenance --ignore-scripts --tag "$tag"
