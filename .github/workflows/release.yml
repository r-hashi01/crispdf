name: release

# Publish crispdf to npm — the ONLY supported way to publish. Triggered by
# pushing a version tag (e.g. v0.0.1) that matches packages/core/package.json.
# Never publish manually from a dev machine.
on:
  push:
    tags: ['v*']

# id-token: write enables npm provenance (signed supply-chain attestation).
permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish crispdf to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Guard: the pushed tag (vX.Y.Z) must equal the package version, so a
      # stray tag can never publish a mismatched version.
      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/core/package.json').version")"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $PKG"
            exit 1
          fi

      # Full quality gate before publishing (mirrors CI), so a release is never
      # cut from an unchecked commit.
      - run: pnpm lint
      - run: pnpm typecheck

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright browsers (and OS deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter crispdf exec playwright install --with-deps chromium
      - name: Install Playwright OS deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter crispdf exec playwright install-deps chromium

      - run: pnpm test
      - run: pnpm build

      # prepublishOnly re-runs typecheck + build; --provenance signs the
      # tarball via the id-token above. NPM_TOKEN is a repo secret (npm
      # automation/granular token with publish rights to crispdf).
      - name: Publish to npm
        run: pnpm --filter crispdf publish --no-git-checks --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
